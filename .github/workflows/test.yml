name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: typecheck + test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Not --frozen-lockfile: Dependabot bumps package.json but can't regenerate
      # bun.lock, so a frozen install fails on every dependency PR.
      - name: Install dependencies
        run: bun install

      - name: Type-check
        run: bun run typecheck

      - name: Run the test suite
        run: bun test

      # The publish build is what consumers actually get, so break the build
      # here rather than at `npm publish`.
      - name: Build the package
        run: bun run build
