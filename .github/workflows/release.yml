name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  # Lets the runner mint the OIDC token npm exchanges for publish rights.
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or newer, which is ahead of what
      # some Node images bundle.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: bun install

      - name: Check the tag against package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $pkg" >&2
            exit 1
          fi

      - name: Type-check
        run: bun run typecheck

      - name: Run the test suite
        run: bun test

      # No token anywhere: npm trades the OIDC token for publish rights and
      # attaches a provenance attestation on the way. prepublishOnly rebuilds
      # dist/ from scratch first.
      - name: Publish
        run: npm publish
