# Keep the GitHub Actions used by our CI / release / REUSE workflows current.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns:
          - "*"

  # The package manifest. Runtime and dev updates land as two PRs, so a bump to
  # what users actually install is reviewed on its own rather than buried in a
  # toolchain batch.
  #
  # Note: Dependabot cannot regenerate bun.lock — it edits package.json only, so
  # every one of these PRs needs `bun install` run locally and the refreshed
  # lockfile committed on top before merging.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "deps"
    groups:
      production-dependencies:
        dependency-type: "production"
        patterns:
          - "*"
      development-dependencies:
        dependency-type: "development"
        patterns:
          - "*"
